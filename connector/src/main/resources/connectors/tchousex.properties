# TCHouse-X connector configuration template.
#
# Usage options:
#   1. Copy this file to <work-dir>/connector.properties; or
#   2. Start the runner with: --connector /path/to/tchousex.properties

# Connector implementation class.
# The implementation encapsulates the JDBC driver class, JDBC URL template,
# extra port names, and product-specific result rendering rules.
connector.impl=framework.connection.tchousexconnector.TchousexConnector

# Required. One or more database endpoints separated by commas.
# Endpoint format: host:jdbc-port[:extra-port-name=port...]
# Multiple endpoints preserve their listed order and can be selected in test
# scripts with session syntax such as (session-id:node-index).
# Example with one endpoint:
connection.endpoints=127.0.0.1:33060:hs2=25000:webserver=25010:http=28000
# Example with multiple endpoints:
# connection.endpoints=host1:33060:hs2=25000:webserver=25010:http=28000,host2:33061:hs2=25001:webserver=25011:http=28001

# Optional. Initial database name for newly created JDBC sessions.
# Default: default
connection.database=default

# Optional. JDBC user name. Leave empty when authentication is not required.
# The value is URL-encoded before it is appended to the JDBC URL.
connection.user=

# Optional. JDBC password. Leave empty when authentication is not required.
# The value is URL-encoded before it is appended to the JDBC URL.
# For production usage, protect this file with appropriate filesystem permissions.
connection.password=

# Optional. Additional JDBC query options in key=value&key=value format.
# Do not include a leading '?' or '&'; both forms are accepted but unnecessary.
# Example: useSSL=false&connectTimeout=10000
connection.jdbcOptions=
